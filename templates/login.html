<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND_NOMBRE}} · Ingresar</title>
<style>
  :root {
    --azul: #1f3864; --azul-claro: #2f5597; --crema: #fbf9f6;
    --texto: #1b2437; --gris: #5b6a7e; --borde: #e4e8f0; --rojo: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--crema) 0%, #eef2f9 100%);
    color: var(--texto);
  }
  .caja {
    width: 100%; max-width: 380px; background: #fff; border-radius: 16px;
    padding: 36px 32px; box-shadow: 0 18px 50px rgba(31, 56, 100, .13);
    border: 1px solid var(--borde);
  }
  .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .badge {
    width: 46px; height: 46px; border-radius: 12px; background: var(--azul);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; letter-spacing: .5px;
  }
  .marca h1 { margin: 0; font-size: 18px; }
  .marca p { margin: 2px 0 0; font-size: 12.5px; color: var(--gris); }
  label {
    display: block; font-size: 12px; font-weight: 600; color: var(--gris);
    text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px;
  }
  input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--borde);
    border-radius: 10px; font-size: 15px; font-family: inherit;
    margin-bottom: 16px; background: #fff; color: var(--texto);
  }
  input:focus { outline: none; border-color: var(--azul-claro); box-shadow: 0 0 0 3px rgba(47, 85, 151, .12); }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: var(--azul); color: #fff; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  button:hover { background: var(--azul-claro); }
  button:disabled { opacity: .6; cursor: default; }
  .error {
    display: none; background: #fdecea; color: var(--rojo); font-size: 13.5px;
    padding: 10px 12px; border-radius: 9px; margin-bottom: 16px;
    border: 1px solid #f5c6c0;
  }
  .error.visible { display: block; }
  .pie { margin-top: 20px; text-align: center; font-size: 12px; color: var(--gris); }
</style>
</head>
<body>
  <form class="caja" id="formLogin" autocomplete="on">
    <div class="marca">
      <div class="badge">{{BRAND_BADGE}}</div>
      <div>
        <h1>{{BRAND_NOMBRE}}</h1>
        <p>CRM y reportes de ventas</p>
      </div>
    </div>
    <div class="error" id="msgError"></div>
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="username" autocapitalize="characters"
           autocomplete="username" required autofocus>
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" name="password" autocomplete="current-password" required>
    <button type="submit" id="btnEntrar">Ingresar</button>
    <div class="pie">Acceso restringido al personal autorizado</div>
  </form>
<script>
const form = document.getElementById('formLogin');
const msg = document.getElementById('msgError');
const btn = document.getElementById('btnEntrar');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true; btn.textContent = 'Entrando…';
  msg.classList.remove('visible');
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('usuario').value.trim(),
        clave: document.getElementById('clave').value,
      }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || 'No se pudo iniciar sesión');
    location.href = '/';
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add('visible');
    document.getElementById('clave').value = '';
    document.getElementById('clave').focus();
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
});
</script>
</body>
</html>
